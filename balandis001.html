<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; text-align: center; padding: 50px; }

  input { 
    font-size: 1.2em; 
    padding: 5px; 
    margin-top: 10px; 
  }

  /* Primary Google Sites-style button */
  button {
    background-color: #1a73e8; /* Google blue */
    color: white;
    border: none;
    border-radius: 4px;
    padding: 10px 24px;
    font-size: 1em;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 0.2s;
    margin: 10px;
  }

  button:hover {
    background-color: #1669c1; /* slightly darker on hover */
  }

  button:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.4);
  }
</style>

</head>
<body>


<!-- Text input -->
<input type="text" id="answer" placeholder="Type here">

<!-- Buttons -->
<div>
  <button id="forgetButton" onclick="goBack()">I forgot, let's go back</button>
  <button id="nextButton" onclick="nextPage()" style="display:none;">Next</button>
</div>

<script>
  const correctAnswer = "balandis";
  const input = document.getElementById('answer');
  const nextButton = document.getElementById('nextButton');
  const forgetButton = document.getElementById('forgetButton');

  input.addEventListener('input', () => {
    if(input.value.trim().toLowerCase() === correctAnswer) {
      nextButton.style.display = 'inline-block';
      forgetButton.style.display = 'none';
    } else {
      nextButton.style.display = 'none';
      forgetButton.style.display = 'inline-block';
    }
  });

  function goBack() {
    window.history.back(); // goes back to first page
  }

  function nextPage() {
    // replace with your next lesson URL
    window.location.href = "https://sites.google.com/view/balandis/home/balandis03";
  }
</script>

<script>  
  input.addEventListener('keypress', function(e) {
    if(e.key === 'Enter' && input.value.trim().toLowerCase() === correctAnswer) {
      nextPage();
    }
  });
</script>
</body>
</html>
