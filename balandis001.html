<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Input</title>
<style>
  /* Minimal style; we’ll rely on Google Sites for button styling */
  body { margin: 0; padding: 0; font-family: inherit; }
  input { font-size: 1em; padding: 4px; }
  /* Buttons are basic here, will inherit Google Sites styling in iframe */
</style>
</head>
<body>

<!-- Input -->
<input type="text" id="answer" placeholder="Type here">

<!-- Buttons -->
<div>
  <button id="forgetButton" onclick="goBack()">I forgot, go back</button>
  <button id="nextButton" onclick="nextPage()" style="display:none;">Next</button>
</div>

<script>
  const correctAnswer = "balandis"; // update per lesson
  const input = document.getElementById('answer');
  const nextButton = document.getElementById('nextButton');
  const forgetButton = document.getElementById('forgetButton');

  input.addEventListener('input', () => {
    if(input.value.trim().toLowerCase() === correctAnswer) {
      nextButton.style.display = 'inline-block';
      forgetButton.style.display = 'none';
    } else {
      nextButton.style.display = 'none';
      forgetButton.style.display = 'inline-block';
    }
  });

  function goBack() {
    window.history.back(); // or set a URL if you prefer
  }

  function nextPage() {
    window.location.href = "lesson3.html"; // replace with actual next page
  }
</script>

</body>
</html>
